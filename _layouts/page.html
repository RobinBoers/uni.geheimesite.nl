---
layout: default
---

{% unless page.noheader %}
  <header>
    <nav>
      <a href="/">← Terug naar de index</a>
    </nav>
  </header>
{% endunless %}

<main>
  {% if page.subtitle %}
    <hgroup>
      <h1>{{ page.title }}{% if page.wip %} <small>(WIP)</small>{% endif %}</h1>
      <p>{{ page.subtitle }}</p>
    </hgroup>
  {% else %}
    <h1>{{ page.title }}{% if page.wip %} <small>(WIP)</small>{% endif %}</h1>
  {% endif %}

  {{ content }}
</main>
